<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Harshit Chaurasia - links</title>
    <meta name="description" content="Harshit Chaurasia's links: portfolio, LinkedIn, GitHub, email and resume.">
    <link rel="canonical" href="https://harshit.saakura.dev/links">
    <meta name="theme-color" content="#fafafd">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2316163a'/%3E%3Ctext x='50' y='64' text-anchor='middle' font-family='sans-serif' font-size='44' font-weight='800' fill='%23fff'%3EHC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme-v2'); } catch (e) {}
        if (!t) t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      body { min-height: 100vh; display: flex; justify-content: center; padding: clamp(2rem, 8vw, 4.5rem) 1rem; }
      main { width: 100%; max-width: 520px; }
      h1 { font-size: clamp(2.2rem, 8vw, 3rem); font-weight: 800; letter-spacing: -0.04em; }
      .role { color: var(--ink-2); font-weight: 600; margin-top: .4rem; }
      .bar { display: flex; gap: 4px; margin: 1.5rem 0 2rem; }
      .bar i { flex: 1; height: 8px; border-radius: 3px; background: var(--c); }
      .links { display: grid; gap: .7rem; }
      .links a {
        display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        padding: 1rem 1.2rem; border-radius: 10px; text-decoration: none; font-weight: 600;
        background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--c);
        transition: border-color .2s, transform .2s var(--ease), box-shadow .2s;
      }
      .links a:hover, .links a:focus-visible { border-color: var(--c); transform: translateX(4px); box-shadow: 0 10px 24px -14px var(--c); }
      .links small { color: var(--ink-2); font-weight: 500; }
      .mirror { margin-top: 2rem; font-size: .88rem; color: var(--ink-2); }
      .mirror a { color: var(--cloud); }
    </style>
</head>
<body>
    <main>
        <h1>Harshit Chaurasia</h1>
        <p class="role">Senior RPA Developer &amp; ML Engineer</p>
        <div class="bar" aria-hidden="true">
            <i style="--c:var(--rpa)"></i><i style="--c:var(--ml)"></i><i style="--c:var(--genai)"></i><i style="--c:var(--cloud)"></i><i style="--c:var(--dev)"></i><i style="--c:var(--ent)"></i><i style="--c:var(--prac)"></i>
        </div>
        <ul class="links">
            <li><a href="https://harshit.saakura.dev" style="--c:var(--ml)">Portfolio <small>harshit.saakura.dev</small></a></li>
            <li><a href="https://www.linkedin.com/in/harshit-raj-chaurasia" style="--c:var(--cloud)">LinkedIn <small>harshit-raj-chaurasia</small></a></li>
            <li><a href="https://github.com/harshitrajchaurasia" style="--c:var(--dev)">GitHub <small>harshitrajchaurasia</small></a></li>
            <li><a href="mailto:harshit1chaurasia@outlook.com" style="--c:var(--genai)">Email <small>harshit1chaurasia@outlook.com</small></a></li>
            <li><a href="/Harshit_Chaurasia_Resume.pdf" style="--c:var(--rpa)" download>Resume <small>PDF</small></a></li>
        </ul>
        <p class="mirror" id="mirror"></p>
    </main>
    <script>
      (function () {
        var h = location.hostname, el = document.getElementById('mirror');
        if (h.indexOf('saakura') > -1) {
          el.innerHTML = 'Mirror: <a href="https://harshitrajchaurasia.github.io/links">harshitrajchaurasia.github.io/links</a>';
        } else {
          el.innerHTML = 'Primary: <a href="https://harshit.saakura.dev/links">harshit.saakura.dev/links</a>';
        }
      })();
    </script>
</body>
</html>
