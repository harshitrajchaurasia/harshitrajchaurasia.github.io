<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Page not found - Harshit Chaurasia</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fafafd">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2316163a'/%3E%3Ctext x='50' y='64' text-anchor='middle' font-family='sans-serif' font-size='44' font-weight='800' fill='%23fff'%3EHC%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
    <!-- absolute paths: this page is served for missing URLs at any depth -->
    <link rel="stylesheet" href="/styles.css">
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme-v2'); } catch (e) {}
        if (!t) t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }
      main { max-width: 560px; }
      /* the site's seven-colour bar with one segment knocked out */
      .bar { display: flex; gap: 4px; margin-bottom: 2.5rem; height: 12px; }
      .bar i { flex: 1; border-radius: 3px; background: var(--c); }
      .bar i.gone { background: none; border: 2px dashed var(--line); animation: drop 1.1s var(--ease) both .4s; }
      @keyframes drop {
        0%   { background: var(--genai); border-color: transparent; transform: none; opacity: 1; }
        60%  { background: var(--genai); border-color: transparent; transform: translateY(34px) rotate(14deg); opacity: 0; }
        61%  { background: none; border-color: var(--line); transform: none; opacity: 0; }
        100% { opacity: 1; }
      }
      .code { font: 800 clamp(5rem, 22vw, 9rem)/.85 var(--font-display); letter-spacing: -0.06em; }
      h1 { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 800; letter-spacing: -0.03em; margin-top: 1rem; }
      p.msg { color: var(--ink-2); font-size: 1.1rem; margin-top: .8rem; }
      .ctas { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
    </style>
</head>
<body>
    <main>
        <div class="bar" aria-hidden="true">
            <i style="--c:var(--rpa)"></i><i style="--c:var(--ml)"></i><i class="gone"></i><i style="--c:var(--cloud)"></i><i style="--c:var(--dev)"></i><i style="--c:var(--ent)"></i><i style="--c:var(--prac)"></i>
        </div>
        <p class="code" aria-hidden="true">404</p>
        <h1>This page isn't here</h1>
        <p class="msg">The link may be old or mistyped. The projects, experience and contact details are all on the homepage.</p>
        <div class="ctas">
            <a href="/" class="btn btn-solid">Go to the homepage</a>
            <a href="/#work" class="btn btn-line">See the projects</a>
        </div>
    </main>
</body>
</html>
