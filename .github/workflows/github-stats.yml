name: github-stats

# Refreshes github-stats.json (read by the site's live activity panel).
# Uses GH_STATS_TOKEN (a read:user PAT) so the contribution calendar counts
# PRIVATE contributions too; it falls back to the built-in GITHUB_TOKEN
# (public contributions only) if the secret is ever removed.

on:
  schedule:
    - cron: '17 4 * * *'   # daily, ~04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: github-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          LOGIN: harshitrajchaurasia
        run: python3 .github/scripts/github_stats.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- github-stats.json; then
            echo "No change."
          else
            # an identity tied to no GitHub account: keeps the bot off the contributors list
            # and off the owner's contribution graph (which the site's stats read)
            git config user.name  'portfolio-stats'
            git config user.email 'noreply@harshit.saakura.dev'
            git add github-stats.json
            # no [skip ci]: Cloudflare Pages honours it and would never redeploy the new numbers
            git commit -m 'chore: refresh github-stats.json'
            git push
          fi
