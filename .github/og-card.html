<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fafafd; color: #16163a; font-family: 'Instrument Sans', sans-serif; position: relative; }
  body::before { content: ""; position: absolute; inset: 0;
    background: radial-gradient(600px 400px at 0% 0%, #7c3aed14, transparent 70%), radial-gradient(500px 400px at 70% 100%, #c2410c12, transparent 70%); }
  .wrap { position: relative; display: grid; grid-template-columns: 1fr 330px; gap: 60px; align-items: center; height: 100%; padding: 0 80px; box-sizing: border-box; }
  h1 { margin: 0; font: 800 88px/0.92 'Bricolage Grotesque'; letter-spacing: -0.045em; font-variation-settings: "opsz" 96; }
  .role { margin-top: 18px; font-size: 28px; font-weight: 600; color: #4b4e6d; }
  .bar { display: flex; gap: 5px; margin: 30px 0 34px; width: 560px; }
  .bar i { flex: 1; height: 12px; border-radius: 4px; }
  .nums { display: flex; gap: 14px; }
  .n { padding: 14px 18px; border-radius: 16px; background: #fff; border: 1px solid #e3e4ef; border-left: 6px solid var(--c); }
  .n b { display: block; font: 800 40px/1 'Bricolage Grotesque'; color: var(--c); letter-spacing: -0.02em; }
  .n span { display: block; margin-top: 6px; font-size: 17px; color: #4b4e6d; }
  .photo { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid #e3e4ef; box-shadow: 0 30px 60px -30px #16163a99; }
  .photo img { display: block; width: 100%; aspect-ratio: 4/5; object-fit: cover; }
  .photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 9px;
    background: linear-gradient(90deg, #c2410c 0 14.28%, #7c3aed 0 28.57%, #be185d 0 42.85%, #2563eb 0 57.14%, #0f766e 0 71.42%, #a16207 0 85.71%, #4d7c0f 0); }
  .url { position: absolute; left: 80px; bottom: 34px; font-size: 20px; font-weight: 600; color: #4b4e6d; }
</style></head>
<body>
<div class="wrap">
  <div>
    <h1>Harshit<br>Chaurasia</h1>
    <div class="role">Senior RPA Developer &amp; ML Engineer</div>
    <div class="bar"><i style="background:#c2410c"></i><i style="background:#7c3aed"></i><i style="background:#be185d"></i><i style="background:#2563eb"></i><i style="background:#0f766e"></i><i style="background:#a16207"></i><i style="background:#4d7c0f"></i></div>
    <div class="nums">
      <div class="n" style="--c:#c2410c"><b>40+</b><span>production bots</span></div>
      <div class="n" style="--c:#7c3aed"><b>160K+</b><span>tickets/month by ML</span></div>
      <div class="n" style="--c:#a16207"><b>2</b><span>TCS copyrights</span></div>
    </div>
  </div>
  <div class="photo"><img src="../portrait.jpg" alt=""></div>
</div>
<div class="url">harshit.saakura.dev</div>
</body></html>
